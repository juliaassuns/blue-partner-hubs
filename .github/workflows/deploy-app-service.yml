name: Deploy to Azure App Service

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Checar que código server-only não vazou pro navegador
        run: bun run check:client-bundle

      - run: bun run build:webjob

      - name: Montar pacote de deploy (app + WebJob)
        run: |
          mkdir -p deploy
          cp -r .output/* deploy/
          mkdir -p deploy/App_Data/jobs/triggered/pc-snapshot
          cp webjob-dist/pc-snapshot/run.js deploy/App_Data/jobs/triggered/pc-snapshot/
          cp webjob/pc-snapshot/settings.job deploy/App_Data/jobs/triggered/pc-snapshot/
          cp webjob/pc-snapshot/package.json deploy/App_Data/jobs/triggered/pc-snapshot/

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-bluepartner-hub
          package: deploy
